<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Deadline - SpeakingBoost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="/css/student/student-layout.css" rel="stylesheet">
</head>
<body>
<div id="pageLoader" class="page-loader">
    <div class="loader-icon"><i class="bi bi-calendar-check-fill"></i></div>
    <div class="loader-text">Đang tải...</div>
</div>

<div id="navbarPlaceholder"></div>

<!-- ═══ PAGE HEADER ══════════════════════════════════════════════ -->
<section style="background:radial-gradient(circle at center,#ffa162 30%,#cc5a02 100%);border:1px solid #bd6806;padding:60px 0;">
    <div class="container text-center">
        <h1 style="font-size:1.6rem;font-weight:800;color:#fff;margin:0;">Bài Deadline</h1>
        <p style="color:rgba(255,255,255,0.85);font-size:0.875rem;margin:6px 0 0;">Bài tập được giáo viên giao. Nộp đúng hạn để đạt điểm tối đa!</p>
    </div>
</section>

<!-- ═══ MAIN ═════════════════════════════════════════════════════ -->
<main style="background:#f0f4f8;padding:28px 0;min-height:calc(100vh - 200px);">
    <div class="container">
        <!-- Stats row -->
        <div class="row g-3 mb-4">
            <div class="col-sm-4">
                <div class="text-center p-4 rounded-4" style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;">
                    <div id="cntPending" style="font-size:2.2rem;font-weight:900;color:#f59e0b;line-height:1;">—</div>
                    <div style="font-size:0.8rem;color:#92400e;font-weight:600;margin-top:4px;">Chờ nộp</div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="text-center p-4 rounded-4" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #bbf7d0;">
                    <div id="cntSubmitted" style="font-size:2.2rem;font-weight:900;color:#16a34a;line-height:1;">—</div>
                    <div style="font-size:0.8rem;color:#14532d;font-weight:600;margin-top:4px;">Đã nộp</div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="text-center p-4 rounded-4" style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border:1px solid #fecaca;">
                    <div id="cntOverdue" style="font-size:2.2rem;font-weight:900;color:#ef4444;line-height:1;">—</div>
                    <div style="font-size:0.8rem;color:#7f1d1d;font-weight:600;margin-top:4px;">Quá hạn</div>
                </div>
            </div>
        </div>

        <!-- Search -->
        <div class="text-center mb-4 pt-2">
            <div class="d-flex justify-content-center">
                <div class="input-group" style="max-width:450px;">
                    <input type="text" class="form-control p-3" style="border-radius:10px;" id="searchInput" placeholder="Tìm theo tên bài tập..." oninput="renderList()">
                </div>
            </div>
        </div>

        <!-- Deadline cards -->
        <div class="row g-3" id="deadlineList">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm me-2"></div>Đang tải...
            </div>
        </div>
    </div>
</main>

<footer style="background:#1e293b;color:#94a3b8;padding:28px 0;">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2" style="font-size:0.78rem;">
            <span>© 2026 SpeakingBoost. All rights reserved.</span>
            <span>Made with <i class="bi bi-heart-fill text-danger"></i> for IELTS Learners</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common/auth.js"></script>
<script src="/js/student/student.js"></script>
<script src="/js/student/deadlines.js"></script>
</body>
</html>
