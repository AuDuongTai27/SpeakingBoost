<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - SpeakingBoost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/student/student-layout.css" rel="stylesheet">
    <link href="/css/student/profile.css" rel="stylesheet">
</head>
<body>

    <div id="pageLoader"><div class="logo-spin"><i class="bi bi-mic-fill"></i></div><p>Đang tải...</p></div>
    <div id="navbarPlaceholder"></div>

    <main class="container py-5">
        <div class="profile-outer profile-wrapper">

            <!-- Hero -->
            <div class="profile-hero text-center">
                <div class="profile-avatar-wrap">
                    <div class="profile-avatar" id="profileAvatar">…</div>
                </div>
                <div class="profile-name" id="profileName">…</div>
                <span class="profile-email-badge">
                    <i class="bi bi-envelope-fill"></i>
                    <span id="profileEmail">…</span>
                </span>
            </div>

            <!-- Card body -->
            <div class="profile-card">

                <!-- Mini stats -->
                <div class="d-flex gap-2 mb-4">
                    <div class="stat-pill">
                        <div class="stat-val" id="statRole">—</div>
                        <div class="stat-label">Vai trò</div>
                    </div>
                    <div class="stat-pill">
                        <div class="stat-val" id="statJoined">—</div>
                        <div class="stat-label">Ngày tham gia</div>
                    </div>
                </div>

                <!-- Form -->
                <p class="section-label"><i class="bi bi-pencil-square me-1"></i>Chỉnh sửa thông tin</p>

                <form id="profileForm" onsubmit="updateProfile(event)">
                    <div class="mb-3">
                        <label class="form-label">Họ và tên</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Mật khẩu mới <span class="fw-normal text-muted">(để trống nếu không đổi)</span></label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-control" id="password" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-save" id="btnSave">
                            <i class="bi bi-check2 me-1"></i>Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
            <!-- /card body -->

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common/auth.js"></script>
    <script src="/js/student/student.js"></script>
    <script src="/js/student/profile.js"></script>
</body>
</html>
